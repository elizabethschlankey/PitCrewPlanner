<!-- fonts.googleapis.com serves the @font-face CSS; the actual font
     FILES come from fonts.gstatic.com (crossorigin required for that
     one, since font fetches are always CORS-checked) — preconnecting
     both means the file download can start the instant the CSS names
     it, instead of only then discovering it needs a fresh connection -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- same idea for Supabase: the very first API call (auth + the
     initial data load) no longer pays for DNS/TLS setup on top of the
     request itself -->
<link rel="preconnect" href="https://ficeyvfwfpyiejmbftad.supabase.co">
<!-- Oswald only ever renders at 600/700 in styles.css (buttons and
     h2/h3 headings) — trimmed from the full default weight range so
     there are 2 font files to fetch instead of 4. Inter genuinely uses
     400/500/600/700 throughout (body text through badge labels), so
     it keeps its full range. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=__V__">

<!-- Supabase SDK pinned to an exact version (was just "@2", which
     jsdelivr only caches for 7 days since it can silently resolve to a
     different 2.x release later) — an exact version's URL never
     changes, so the browser can cache it for a full year. Bump this
     string on purpose (check the current version at
     https://data.jsdelivr.com/v1/packages/npm/@supabase/supabase-js)
     when you actually want the newer SDK; it won't drift on its own
     anymore. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

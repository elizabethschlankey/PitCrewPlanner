    <div class="tab-panel" id="admin-tab-templates">
      <p class="hint">Reusable starting layouts (Football, BOA Comp, UIL Comp, ...). Pick one when creating a new event, or start blank.</p>
      <div class="template-list" id="template-list"></div>
      <div style="margin-top:8px;">
        <button id="btn-new-template" class="small primary" type="button">+ New Template</button>
      </div>
      <div class="inline-form" id="template-form">
        <div class="form-label" id="template-form-label">New Template</div>
        <input type="text" name="name" id="template-form-name" placeholder="Template name, e.g. Football" maxlength="60">
        <input type="text" name="description" id="template-form-description" placeholder="Description (optional)" maxlength="120">
        <button id="template-form-create" class="small primary" type="button">Create</button>
        <button id="template-form-cancel" class="small ghost" type="button">Cancel</button>
      </div>
    </div>

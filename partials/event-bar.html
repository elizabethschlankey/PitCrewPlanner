  <div class="event-bar" data-event-only>
    <label for="event-select">Event</label>
    <select id="event-select"></select>
    <span class="pill template" id="hdr-template-pill" title="Template this event follows"></span>
    <!-- mobile-only: Rename/New Event/Duplicate/Switch Template/Save
         as Template/Delete Event below, plus Export Season Data/Clear
         Items from the header, collapse into this on phones (see
         js/field.js) — those all need to see the field at the same
         time as you use them, a desktop thing. Lives next to the
         event picker since that's what it's actually related to. -->
    <button type="button" id="mobile-more-toggle" class="small ghost mobile-more-toggle" data-edit-only aria-haspopup="true" aria-expanded="false" title="More actions">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="12" cy="5.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="18.5" r="1.6" fill="currentColor"/></svg>
    </button>
    <div class="mobile-more-menu" id="mobile-more-menu" data-edit-only hidden></div>
    <button id="btn-set-current" class="small" data-edit-only title="Make this the event volunteers see by default">🔴 Go Live</button>
    <button id="btn-rename-event" class="small" data-edit-only>✎ Rename</button>
    <button id="btn-new-event" class="small" data-edit-only>+ New Event</button>
    <!-- Duplicate/Switch Template/Save as Template are the least-used
         event actions, so they live behind their own always-on kebab
         instead of sitting in the main row every time — separate from
         mobile-more-toggle above, which is a phone-only space-saver for
         a DIFFERENT set of buttons (see js/field.js); this one shows at
         every width since these three are just rarely needed, not
         merely "in the way on a small screen." -->
    <button type="button" id="event-actions-toggle" class="small ghost event-actions-toggle" data-edit-only aria-haspopup="true" aria-expanded="false" title="More event actions">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="12" cy="5.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="18.5" r="1.6" fill="currentColor"/></svg>
    </button>
    <div class="event-actions-menu" id="event-actions-menu" data-edit-only hidden>
      <button id="btn-dup-event" class="small">⧉ Duplicate</button>
      <button id="btn-switch-template" class="small">⇄ Switch Template</button>
      <button id="btn-save-as-template" class="small">💾 Save as Template</button>
    </div>
    <button id="btn-del-event" class="small danger" data-edit-only>Delete Event</button>
    <!-- everyone (guest included) can open this, so it's not grouped
         with the edit-only actions above — pinned to the far right of
         the row (see #btn-itinerary in styles.css) instead of just
         sitting wherever it lands in the flow, since it's the one
         action here that isn't about managing the event itself -->
    <button id="btn-itinerary" class="small" data-event-only title="Itinerary — a day-of timeline for this event">🕐 Itinerary</button>
    <div class="inline-form" id="event-form">
      <div class="form-label" id="event-form-label">New Event</div>
      <input type="text" name="name" id="event-form-name" placeholder="Event name, e.g. Homecoming vs. Ridgeview" maxlength="60">
      <input type="date" name="date" id="event-form-date">
      <select id="event-form-type" title="Event type — feeds the Home/Away/Competitions breakdown in Volunteer Analytics">
        <option value="">Event Type: Not Set</option>
        <option value="home">Home</option>
        <option value="away">Away</option>
        <option value="contest">Competition</option>
      </select>
      <select id="event-form-template" title="Start the field layout from a template"></select>
      <select id="event-form-itinerary-template" title="Start the Itinerary tab from a template"></select>
      <button id="event-form-create" class="small primary" type="button">Create</button>
      <button id="event-form-cancel" class="small ghost" type="button">Cancel</button>
    </div>
    <div class="inline-form" id="switch-template-form">
      <div class="form-label">Switch which template this event follows</div>
      <select id="switch-template-select"></select>
      <button id="switch-template-apply" class="small primary" type="button">Apply</button>
      <button id="switch-template-cancel" class="small ghost" type="button">Cancel</button>
    </div>
    <div class="inline-form" id="save-as-template-form">
      <div class="form-label">Save “<span id="save-as-template-source"></span>” as a new template — layout, tags, and notes carry over; nobody starts pre-assigned to help.</div>
      <input type="text" name="name" id="save-as-template-name" placeholder="Template name, e.g. Homecoming Layout" maxlength="60">
      <input type="text" name="description" id="save-as-template-description" placeholder="Description (optional)" maxlength="120">
      <button id="save-as-template-create" class="small primary" type="button">Save Template</button>
      <button id="save-as-template-cancel" class="small ghost" type="button">Cancel</button>
    </div>
  </div>

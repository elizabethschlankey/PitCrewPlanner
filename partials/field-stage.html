    <main class="stage">
      <div class="field-fill">
        <div class="field-viewport" id="field-viewport">
          <div class="field-wrap" id="field-wrap">
            <svg id="field" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="drop-layer"></div>
          </div>
          <div id="offscreen-arrows"></div>
          <div class="zoom-controls">
            <button id="btn-zoom-pit" class="primary">Zoom to Pit Box</button>
            <button id="btn-zoom-reset" style="display:none;">Zoom to Full Field</button>
            <button id="btn-toggle-labels" type="button">Hide Labels</button>
            <button id="btn-field-fullscreen" type="button" class="field-fullscreen-btn">
              <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 1-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Full Screen</span>
            </button>
          </div>
          <div class="readonly-badge">View only</div>
          <div class="pit-badge">White box = pit equipment area · Blue line = speaker back-wheel line</div>
          <div class="rotate-hint" id="rotate-hint" hidden>
            <svg viewBox="0 0 24 24" fill="none" width="28" height="28"><rect x="7" y="2" width="10" height="16" rx="1.5" stroke="currentColor" stroke-width="1.8"/><line x1="12" y1="15.2" x2="12" y2="15.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 8a6 6 0 0 1-1.2 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M19.5 4.5l0.5 4-4-0.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span>Turn your phone sideways for the full-screen view</span>
          </div>
        </div>
      </div>
      <div class="mobile-field-toolbar" id="mobile-field-toolbar"></div>
      <div class="legend-wrap">
        <button type="button" class="legend-toggle" id="legend-toggle">
          <span>Legend</span>
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="legend" id="legend"></div>
      </div>
    </main>

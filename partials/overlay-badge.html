<div id="badge-overlay" class="overlay" style="display:none;">
  <div class="inspector-card">
    <h3 id="badge-title">Badge</h3>
    <div class="item-sub" id="badge-status-line"></div>
    <img id="badge-status-photo" style="display:none;width:100%;border-radius:8px;object-fit:cover;max-height:220px;">

    <div id="badge-action-form" style="display:flex;flex-direction:column;gap:14px;"></div>

    <div class="field-group">
      <label>History</label>
      <div id="badge-history" style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;"></div>
    </div>

    <div class="row-end">
      <button id="badge-delete" class="danger">Delete Badge</button>
      <button id="badge-close">Close</button>
    </div>
  </div>
</div>
